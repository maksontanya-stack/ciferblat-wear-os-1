name: Wear OS emulator smoke test
on:
  workflow_dispatch:
    inputs:
      api_level:
        description: Android API level (36 Wear OS 6)
        required: true
        default: "36"
      gpu_mode:
        description: Emulator graphics backend
        required: false
        default: swiftshader_indirect
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate WFF before emulator startup
        run: |
          python3 scripts/verify_runtime.py
          curl --fail --location --retry 3 https://github.com/google/watchface/releases/download/release/wff-validator.jar --output "$RUNNER_TEMP/wff-validator.jar"
          java -jar "$RUNNER_TEMP/wff-validator.jar" 4 --stop-on-fail watchface/src/main/res/raw/watchface.xml
      - run: |
          python3 scripts/generate_test_overlay.py
          bash scripts/build_upgrade_fixture.sh
          ./gradlew :watchface:assembleDebug :testprovider:assembleDebug --console=plain
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install screenshot verifier
        run: python3 -m pip install Pillow==11.3.0
      - name: Install and render on Wear OS
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api_level }}
          target: android-wear-signed
          arch: x86_64
          profile: wearos_large_round
          ram-size: 2048M
          heap-size: 256M
          emulator-options: -no-window -gpu ${{ inputs.gpu_mode || 'swiftshader_indirect' }} -feature -Vulkan -no-snapshot -noaudio -no-boot-anim
          disable-animations: false
          script: bash scripts/emulator-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wearos-emulator-screenshots
          path: smoke-output/
          if-no-files-found: ignore

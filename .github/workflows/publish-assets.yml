name: Publish signed installation bundle
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify and publish prepared signed files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release-assets/v1.2.0-preview.4-lab
          sha256sum --check SHA256SUMS-lab.txt
          gh release upload v1.2.0-preview.4 Galaxy-Watch-Lab-one-click-Windows.zip SHA256SUMS-lab.txt --clobber --repo "$GITHUB_REPOSITORY"

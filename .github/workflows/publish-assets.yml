name: Publish signed installation bundle
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify and publish prepared signed files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release-assets/v1.2.0-preview.4-phone
          sha256sum --check SHA256SUMS-phone.txt
          gh release upload v1.2.0-preview.4 wearos1-1.2.0-preview.4.apk wearos1-geminiman-1.2.0-preview.4.zip INSTALL-GEMINIMAN-RU.pdf INSTALL-GEMINIMAN-RU.txt SHA256SUMS-phone.txt --clobber --repo "$GITHUB_REPOSITORY"

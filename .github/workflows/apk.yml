name: Build Wear OS APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      SIGNING_KEY: ${{ secrets.WEAROS_SIGNING_KEY }}
      SIGNING_PASSWORD: ${{ secrets.WEAROS_SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate WFF v1 with official validator
        run: |
          curl --fail --location --retry 3 https://github.com/google/watchface/releases/download/release/wff-validator.jar --output "$RUNNER_TEMP/wff-validator.jar"
          java -jar "$RUNNER_TEMP/wff-validator.jar" 1 --stop-on-fail watchface/src/main/res/raw/watchface.xml
      - name: Check generated WFF and all bitmap words
        run: python3 scripts/verify_runtime.py
      - name: Build resource-only watchface APK
        run: ./gradlew :watchface:assembleRelease :watchface:lintRelease --console=plain
      - name: Verify resource-only APK and memory limits
        run: |
          python3 scripts/verify_apk.py watchface/build/outputs/apk/release/watchface-release-unsigned.apk
          curl --fail --location --retry 3 https://github.com/google/watchface/releases/download/release/memory-footprint.jar --output "$RUNNER_TEMP/memory-footprint.jar"
          java -jar "$RUNNER_TEMP/memory-footprint.jar" --watch-face watchface/build/outputs/apk/release/watchface-release-unsigned.apk --schema-version 1 --ambient-limit-mb 10 --active-limit-mb 100
      - name: Prepare APK
        run: |
          mkdir -p dist
          cp watchface/build/outputs/apk/release/watchface-release-unsigned.apk dist/wearos1-unsigned.apk
      - name: Sign APK when signing secrets are configured
        if: env.SIGNING_KEY != '' && env.SIGNING_PASSWORD != ''
        run: |
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/wearos1.p12"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$RUNNER_TEMP/wearos1.p12" --ks-key-alias wearos1 --ks-pass env:SIGNING_PASSWORD --out dist/wearos1.apk dist/wearos1-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/wearos1.apk
          rm "$RUNNER_TEMP/wearos1.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: wearos1-apk
          path: dist/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint
          path: watchface/build/reports/lint-results-release.html
          if-no-files-found: ignore
